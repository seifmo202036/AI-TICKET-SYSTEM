name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_ticket_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_ticket_system_test
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-32chars
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck (e2e)
        run: npm run typecheck:e2e

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Migrate database
        run: npm run migrate

      - name: Smoke tests (auth)
        run: npm run test:auth

      # Playwright boots the app itself on port 3100 with NODE_ENV=test
      - name: E2E tests
        run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    needs: [verify, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag ai-ticket-system-api:ci .

      - name: Build web image
        run: docker build --tag ai-ticket-system-web:ci ./web

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
