name: ai-ticket-system

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: 3000
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_ticket_system}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env before starting Docker Compose}
  CLIENT_ORIGIN: http://localhost:8080
  REDIS_URL: redis://redis:6379

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_ticket_system}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  migrate:
    build:
      context: .
    command: npm run migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment: *app-environment
    restart: 'no'

  api:
    build:
      context: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment: *app-environment
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const net = require('node:net'); const socket = net.connect(3000, '127.0.0.1'); socket.on('connect', () => process.exit(0)); socket.on('error', () => process.exit(1));",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
    command: npm run start:worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment: *app-environment
    restart: on-failure

  web:
    build:
      context: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '8080:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
